# Lives at /etc/apache2/conf-available/apman.conf on the controller.
# The client stream is served by the subscriber's event loop (SseServer,
# tcp://127.0.0.1:18080): an EventSource connection costs it one more stream
# on a loop that already carries mqtt and radius. Holding a php-fpm worker
# per open tab instead would stall the pool (five workers) at six tabs.
# Apache hands the path over and streams it through.
ProxyPass /apman/stream/clients http://127.0.0.1:18080/stream/clients
ProxyPassReverse /apman/stream/clients http://127.0.0.1:18080/stream/clients

Alias /apman /usr/local/share/apman/public
KeepAliveTimeout 60
<Directory "/usr/local/share/apman/public">
    Options Indexes FollowSymlinks
    AllowOverride All
    Require all granted
    AddDefaultCharset off
    DirectoryIndex index.php
</Directory>
