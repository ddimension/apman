monolog:
    handlers:
        main:
            # was a plain stream, which grew to 2.5 GB the one time something ran
            # in dev by accident and nobody looked for months
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: 3
            level: debug
            channels: ["!event"]
        # uncomment to get logging in your browser
        # you may have to allow bigger header sizes in your Web server configuration
        #firephp:
        #    type: firephp
        #    level: info
        #chromephp:
        #    type: chromephp
        #    level: info
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine", "!console"]
