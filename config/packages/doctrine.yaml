doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '5.7'

        # FreeRADIUS keeps its own tables in this database. ORM 2 left unmapped
        # tables alone; ORM 3 dropped that mode, so doctrine:schema:update now
        # proposes DROP TABLE for every one of them. Hiding them from schema
        # introspection keeps a --force from taking another program's tables
        # with it. Named one by one on purpose: our own radio and radius_auth
        # would fall into any "^rad" pattern.
        schema_filter: '~^(?!(nas|nasreload|radacct|radcheck|radgroupcheck|radgroupreply|radpostauth|radreply|radusergroup)$)~'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            ApManBundle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'ApManBundle\Entity'
                alias: ApManBundle
