monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        nested:
            # was /dev/null, which left every production error invisible.
            # rotating so this cannot grow into a multi gigabyte file again.
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: 7
            level: debug
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
